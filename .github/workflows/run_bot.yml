name: EPG Movie Bot

on:
  schedule:
    - cron: '0 8 * * *' # هر روز ساعت ۸ صبح به وقت جهانی (UTC) اجرا می‌شود
  workflow_dispatch: # به شما اجازه می‌دهد هر زمان خواستید دستی هم آن را اجرا کنید

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
        
